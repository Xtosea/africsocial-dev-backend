name: AfricSocial Development Worker Deployment

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: africsocial-api-dev-deployment
  cancel-in-progress: false

jobs:
  deploy-development:
    if: github.ref == 'refs/heads/development'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout development branch
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Verify development Worker target
        shell: bash
        run: |
          set -euo pipefail

          node --input-type=module <<'NODE'
          import { readFileSync } from "node:fs";

          const config = readFileSync("wrangler.jsonc", "utf8");
          const match = config.match(/^\s*"name"\s*:\s*"([^"]+)"/m);

          if (!match || match[1] !== "africsocial-api-dev") {
            console.error("ERROR: Expected Worker africsocial-api-dev.");
            process.exit(1);
          }

          console.log("Verified target: africsocial-api-dev");
          NODE

      - name: Validate development Worker build
        run: npx --yes wrangler@4.123.0 deploy --config wrangler.jsonc --dry-run

      - name: Deploy development Worker
        run: npx --yes wrangler@4.123.0 deploy --config wrangler.jsonc
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
