name: Deploy AfricSocial Worker

on:
  push:
    branches:
      - development

  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Wrangler
        run: npm install --global wrangler@4.123.0

      - name: Check Wrangler
        run: wrangler --version

      - name: Sync development secrets to Cloudflare Worker
        env:
          MONGO_URI: ${{ secrets.MONGO_URI }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          PAYSTACK_SECRET_KEY: ${{ secrets.PAYSTACK_SECRET_KEY }}
          CLOUDINARY_API_KEY: ${{ secrets.CLOUDINARY_API_KEY }}
          CLOUDINARY_API_SECRET: ${{ secrets.CLOUDINARY_API_SECRET }}
          CLOUDINARY_CLOUD_NAME: ${{ secrets.CLOUDINARY_CLOUD_NAME }}
          IMAGEKIT_PRIVATE_KEY: ${{ secrets.IMAGEKIT_PRIVATE_KEY }}
        run: |
          printf '%s' "$MONGO_URI" | wrangler secret put MONGO_URI --config wrangler.jsonc
          printf '%s' "$JWT_SECRET" | wrangler secret put JWT_SECRET --config wrangler.jsonc
          printf '%s' "$PAYSTACK_SECRET_KEY" | wrangler secret put PAYSTACK_SECRET_KEY --config wrangler.jsonc
          printf '%s' "$CLOUDINARY_API_KEY" | wrangler secret put CLOUDINARY_API_KEY --config wrangler.jsonc
          printf '%s' "$CLOUDINARY_API_SECRET" | wrangler secret put CLOUDINARY_API_SECRET --config wrangler.jsonc
          printf '%s' "$CLOUDINARY_CLOUD_NAME" | wrangler secret put CLOUDINARY_CLOUD_NAME --config wrangler.jsonc
          printf '%s' "$IMAGEKIT_PRIVATE_KEY" | wrangler secret put IMAGEKIT_PRIVATE_KEY --config wrangler.jsonc

      - name: Deploy to Cloudflare Workers
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          wrangler deploy --config wrangler.jsonc || {
            echo "===== WRANGLER LOGS ====="
            find "$HOME/.config/.wrangler/logs" -maxdepth 1 -type f -print -exec cat {} \;
            echo "===== END WRANGLER LOGS ====="
            exit 1
          }