name: Deploy AfricSocial Worker

on:
  push:
    branches:
      - development

  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Wrangler
        run: npm install --global wrangler@4.123.0

      - name: Check Wrangler
        run: wrangler --version

      - name: Deploy to Cloudflare Workers
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          wrangler deploy --config wrangler.jsonc || {
            echo "===== WRANGLER LOGS ====="
            find "$HOME/.config/.wrangler/logs" -maxdepth 1 -type f -print -exec cat {} \;
            echo "===== END WRANGLER LOGS ====="
            exit 1
          }